[package]
name = "youdao-llm-proxy"
version = "0.3.2"
edition = "2021"
description = "OpenAI/vLLM-compatible LLM API that mimics Youdao Dictionary's internal DeepSeek (luna-ai) calling method"

[[bin]]
name = "youdao-llm-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
futures = "0.3"
bytes = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
urlencoding = "2"

[profile.release]
lto = true
strip = true
