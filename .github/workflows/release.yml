name: Release

# A release is cut ONLY when a version tag is pushed:
#   1. bump `version` in Cargo.toml and commit it to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must match the Cargo.toml version, otherwise the build fails.
on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - id: verify
        name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$ver" ] || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match Cargo.toml version 'v${ver}'"
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          pkg=youdao-llm-proxy-${{ matrix.target }}
          mkdir -p dist/${pkg}
          cp target/${{ matrix.target }}/release/youdao-llm-proxy dist/${pkg}/
          printf 'version: %s\ntarget: %s\ncommit: %s\n' \
            "${{ steps.verify.outputs.version }}" "${{ matrix.target }}" "${GITHUB_SHA:0:7}" > dist/${pkg}/BUILD
          tar -C dist -czf "${pkg}.tar.gz" ${pkg}
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          else
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          fi
          echo "--- ${pkg}.tar.gz ---"
          cat "${pkg}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            youdao-llm-proxy-${{ matrix.target }}.tar.gz
            youdao-llm-proxy-${{ matrix.target }}.tar.gz.sha256

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect artifacts
        run: find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp -f {} . \;
      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.tar.gz
            *.sha256
