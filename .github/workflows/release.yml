name: Release

# Push to main  -> a build-N pre-release (auto-versioned, accumulates)
# Push a v* tag -> a formal release at that tag
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          pkg=youdao-llm-proxy-${{ matrix.target }}
          mkdir -p dist/${pkg}
          cp target/${{ matrix.target }}/release/youdao-llm-proxy dist/${pkg}/
          printf 'target: %s\ncommit: %s\n' "${{ matrix.target }}" "${GITHUB_SHA:0:7}" > dist/${pkg}/BUILD
          tar -C dist -czf "${pkg}.tar.gz" ${pkg}
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          else
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          fi
          echo "--- ${pkg}.tar.gz ---"
          cat "${pkg}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            youdao-llm-proxy-${{ matrix.target }}.tar.gz
            youdao-llm-proxy-${{ matrix.target }}.tar.gz.sha256

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect artifacts
        run: find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp -f {} . \;
      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build #{0}', github.run_number) }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: false
          files: |
            *.tar.gz
            *.sha256
