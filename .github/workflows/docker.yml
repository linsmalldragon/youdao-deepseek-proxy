name: Docker

# Push a multi-arch image to Docker Hub when a version tag is pushed.
# Requires repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    tags: [ 'v*' ]

jobs:
  docker:
    name: docker (linux/amd64,linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ -n "$ver" ] || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match Cargo.toml version 'v${ver}'"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            linsmalldragon/youdao-deepseek-proxy:latest
            linsmalldragon/youdao-deepseek-proxy:${{ github.ref_name }}
          cache-from: type=gha,scope=docker-deepseek-proxy
          cache-to: type=gha,mode=max,scope=docker-deepseek-proxy
